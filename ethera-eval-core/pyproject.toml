[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ethera-eval-core"
version = "0.1.0"
description = "Backend API, evaluation runner and shared library of the Ethera Eval Platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependencies are pinned per service in requirements/*.txt, not declared here.
dependencies = []

[tool.setuptools.packages.find]
include = ["backend*", "runner*", "common_lib*", "migrations*", "evals*", "scripts*"]

[tool.setuptools.package-data]
"common_lib.schemas" = ["data/*.txt"]

# Configuration of the `tortoise` migration command line (makemigrations, sqlmigrate).
[tool.tortoise]
tortoise_orm = "evals.migration_cli.TORTOISE_ORM"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "N",     # naming
    "UP",    # modern syntax for the target version
    "B",     # likely bugs
    "S",     # security
    "ASYNC", # blocking calls in async code
    "C4",    # comprehensions
    "SIM",   # simplifications
    "RET",   # return statements
    "PTH",   # pathlib over os.path
    "PT",    # pytest style
    "T20",   # stray print calls
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Generated by `tortoise makemigrations`: the framework requires these class
# attributes, and table comments are copied verbatim from model docstrings.
"migrations/*.py" = ["RUF012", "E501"]
"tests/**" = [
    "S101", # assert is how pytest checks results
    "S105", # tests use deliberately fake passwords and secrets
    "S106",
]
# The brief names the append-only module registry `evals/MODULES.py` (upper case on purpose:
# it reads as a registry, not as code to import piecemeal).
"evals/MODULES.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "runner", "common_lib", "evals", "scripts"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["backend", "runner", "common_lib", "evals", "scripts", "tests"]
# Test folders have no __init__.py; name modules by their path so equally named
# test files in different folders do not clash.
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Coverage for the gates (scripts/coverage_gates.py, docs/DECISIONS.md D-008). Branch
# coverage: an untested 403 branch is exactly what the 100% gate exists to catch.
[tool.coverage.run]
source = ["backend", "runner", "common_lib", "evals"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Contracts are added once the modules they name exist; a contract naming a
# missing module fails.
[tool.importlinter]
root_packages = ["backend", "runner", "common_lib", "evals"]
# Needed so contracts can forbid third-party packages such as the ORM.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The backend and the runner do not import each other"
type = "independence"
modules = ["backend", "runner"]

# The API calls services, and services use the data access layer, so the API reaches
# the database indirectly by design. What is forbidden is the API importing the data
# access layer, the models or the ORM itself.
[[tool.importlinter.contracts]]
name = "The API layer never touches the database directly"
type = "forbidden"
source_modules = ["backend.api"]
forbidden_modules = ["backend.dal", "common_lib.models", "tortoise"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Backend layers depend downwards only: api -> services -> dal"
type = "layers"
layers = ["backend.api", "backend.services", "backend.dal"]

# Business logic stays independent of transport: services see the broker and HTTP only
# through Protocols, and the messaging infrastructure never reaches into the API.
[[tool.importlinter.contracts]]
name = "Services never import the broker, messaging or HTTP code"
type = "forbidden"
source_modules = ["backend.services"]
forbidden_modules = ["backend.messaging", "backend.api", "aio_pika", "fastapi"]

[[tool.importlinter.contracts]]
name = "Messaging never imports the API"
type = "forbidden"
source_modules = ["backend.messaging"]
forbidden_modules = ["backend.api", "fastapi"]

[[tool.importlinter.contracts]]
name = "The runner has no database access"
type = "forbidden"
source_modules = ["runner"]
forbidden_modules = ["common_lib.models", "tortoise"]

# The runner image copies all of common_lib but installs no ORM, so everything it can
# import must stay ORM-free. A new common_lib module is added to this list.
[[tool.importlinter.contracts]]
name = "Shared modules outside common_lib.models are ORM-free"
type = "forbidden"
source_modules = [
    "common_lib.errors",
    "common_lib.logging_config",
    "common_lib.messaging",
    "common_lib.permissions",
    "common_lib.request_id",
    "common_lib.schemas",
    "common_lib.settings",
]
forbidden_modules = ["common_lib.models", "tortoise"]

# Platform core vs domain (docs/DECISIONS.md D-003): the core boots without the domain, and
# the domain reaches the core only through the `backend` barrel.
[[tool.importlinter.contracts]]
name = "The platform core never imports the domain"
type = "forbidden"
source_modules = ["backend", "runner", "common_lib"]
forbidden_modules = ["evals"]

[[tool.importlinter.contracts]]
name = "The domain reaches the core only through its barrel"
type = "forbidden"
source_modules = ["evals"]
forbidden_modules = [
    "backend.api",
    "backend.core",
    "backend.dal",
    "backend.messaging",
    "backend.services",
    "backend.main",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The runner never imports the domain or the core"
type = "forbidden"
source_modules = ["runner"]
forbidden_modules = ["backend", "evals"]

