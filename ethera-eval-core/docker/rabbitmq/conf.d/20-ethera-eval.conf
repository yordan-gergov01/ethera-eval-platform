# Broker settings for the Ethera Eval Platform, applied after the image's 10-defaults.conf.

# Vhost, users and permissions come from a definitions file rendered from
# environment variables at container start (see provision-entrypoint.sh).
# Importing definitions at boot also stops the default "guest" user from being
# created.
load_definitions = /run/rabbitmq-definitions/definitions.json

# The image allows "guest" from any host; restore the loopback-only default as
# a second safeguard in case such a user is ever created.
loopback_users.guest = true
